# @package _global_

judge_name: DecayCPFSim

abstention_detector:
  _target_: recipe.decay_cpf_sim_detector.DecayCPFSimAbstentionDetector
  model_name: all-MiniLM-L6-v2
  threshold: 0.60
  gamma: 0.85
  max_sentences: 3
  batch_size: 256
  include_full_opening: true
  save_dir: ${save_dir}

abstention_detector_launcher:
  gpus_per_node: 1
  nodes: 1
  tasks_per_node: 1
  cpus_per_task: 8
  timeout_min: 120
  slurm_partition: devlab,learnlab,learnfair
  mem_gb: 32
  slurm_srun_args: ["-vv", "--cpu-bind", "none"]
  comment: "decay-cpf-sim eval step"
