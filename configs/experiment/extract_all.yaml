name: extract_all

# model_id: hf_model_name
models:
  Qwen2_5_0_5B_Instruct: Qwen/Qwen2.5-0.5B-Instruct
  Qwen2_5_1_5B_Instruct: Qwen/Qwen2.5-1.5B-Instruct
  Qwen2_5_3B_Instruct: Qwen/Qwen2.5-3B-Instruct
  Qwen2_5_7B_Instruct: Qwen/Qwen2.5-7B-Instruct
  Gemma3_1B_Instruct: google/gemma-3-1b-it
  Llama3_1_Tulu_3_1_8B: allenai/Llama-3.1-Tulu-3-8B

data_path: data/sample_pairs_with_scenario.csv
output_base: data/vectors

extraction:
  use_system_prompt: true
  weighted: false
  exclude_scenarios: ""
  normalize: false
  response_tokens: 10
  # layers: auto-detected from HF model config. Or set explicitly, e.g. "11-23"

slurm:
  partition: gpu
  qos: gpu
  gres: "gpu:1"
  cpus_per_task: 8
  mem: "82G"
  time: "02:00:00"
